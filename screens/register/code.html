<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d462",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102218",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Crear cuenta - Rehogar</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-background-dark shadow-2xl">
<header class="flex items-center p-4 pb-2 justify-between">
<a href="/screens-static/login/code.html" class="cursor-pointer"><button aria-label="Volver" class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined">arrow_back</span>
</button></a>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Rehogar</h2>
</header>
<main class="flex flex-col flex-1 px-6 py-8">
<div class="mb-8 text-center">
<h1 class="tracking-tight text-[26px] font-bold leading-tight pb-2">Crear cuenta</h1>
<p class="text-slate-600 dark:text-slate-400 text-base">Empieza hoy tu nuevo comienzo.</p>
</div>

<div id="error" class="hidden mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-600"></div>

<form id="register-form" class="flex flex-col gap-4" novalidate>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Nombre</span>
<input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Tu nombre"
class="rounded-xl border border-[#e0e7e3] dark:border-slate-700 bg-[#f0f4f2] dark:bg-slate-800 px-4 py-3.5 text-base outline-none focus:border-primary focus:bg-white dark:focus:bg-slate-700 transition-colors">
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Email</span>
<input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com"
class="rounded-xl border border-[#e0e7e3] dark:border-slate-700 bg-[#f0f4f2] dark:bg-slate-800 px-4 py-3.5 text-base outline-none focus:border-primary focus:bg-white dark:focus:bg-slate-700 transition-colors">
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Contraseña</span>
<input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"
class="rounded-xl border border-[#e0e7e3] dark:border-slate-700 bg-[#f0f4f2] dark:bg-slate-800 px-4 py-3.5 text-base outline-none focus:border-primary focus:bg-white dark:focus:bg-slate-700 transition-colors">
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">¿Qué buscas?</span>
<select id="rol" name="rol"
class="rounded-xl border border-[#e0e7e3] dark:border-slate-700 bg-[#f0f4f2] dark:bg-slate-800 px-4 py-3.5 text-base outline-none focus:border-primary transition-colors">
<option value="buscador">Buscar un hogar</option>
<option value="anfitrion">Compartir mi casa</option>
<option value="ambos">Ambas cosas</option>
</select>
</label>
<button id="submit-btn" type="submit"
class="mt-2 w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
Crear cuenta
</button>
</form>

<div class="mt-6 text-center text-sm text-slate-500">
¿Ya tienes cuenta? <a href="/screens-static/login/code.html" class="text-primary font-semibold">Iniciar sesión</a>
</div>
</main>
</div>
<script>
(function () {
  var form = document.getElementById('register-form');
  var err = document.getElementById('error');
  var btn = document.getElementById('submit-btn');
  var rolSel = document.getElementById('rol');
  var rolGuardado = localStorage.getItem('rehogar_rol');
  if (rolSel && rolGuardado) {
    rolSel.value = rolGuardado;
    localStorage.removeItem('rehogar_rol');
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var nombre = document.getElementById('nombre').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var rol = document.getElementById('rol').value;
    err.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Creando cuenta...';
    try {
      var res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: nombre, email: email, password: password, rol: rol }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        if (data.detalles && data.detalles.length) {
          err.textContent = data.detalles[0].mensaje;
        } else {
          err.textContent = data.error || 'No se pudo crear la cuenta';
        }
        err.classList.remove('hidden');
        return;
      }
      localStorage.setItem('rehogar_token', data.token);
      window.location.href = '/';
    } catch (ex) {
      err.textContent = 'Error de conexión con el servidor';
      err.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }
  });
})();
</script>
<script src="/nav.js"></script>
</body></html>
