<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Mapa de Casas - Rehogar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d462",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102218",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .map-grid {
            background-color: #e2e8f0;
            background-image:
                linear-gradient(rgba(17, 212, 98, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(17, 212, 98, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 20% 30%, rgba(17, 212, 98, 0.10), transparent 45%),
                radial-gradient(circle at 75% 70%, rgba(17, 212, 98, 0.08), transparent 40%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
        }
        .dark .map-grid {
            background-color: #0f1d16;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative h-screen w-full overflow-hidden flex flex-col">
<div class="absolute inset-0 z-0">
<div class="w-full h-full map-grid" data-alt="Mapa de casas con calles y parques">
<div id="map-pins" class="relative w-full h-full"></div>
</div>
</div>
<div class="relative z-10 w-full p-4 flex flex-col gap-3 pointer-events-none">
<div class="flex gap-2 w-full pointer-events-auto">
<div class="flex-1 flex items-center bg-white dark:bg-background-dark shadow-xl rounded-xl px-4 h-14 border border-slate-200/50 dark:border-slate-700/50">
<span class="material-symbols-outlined text-slate-400 mr-2">search</span>
<input id="filter-search" class="bg-transparent border-none focus:ring-0 text-base w-full placeholder:text-slate-400" placeholder="Buscar por ciudad o barrio..." type="text">
</div>
<a href="/screens-static/busqueda_avanzada_con_custodia/code.html" class="cursor-pointer"><button class="bg-white dark:bg-background-dark shadow-xl rounded-xl h-14 w-14 flex items-center justify-center border border-slate-200/50 dark:border-slate-700/50 text-slate-700 dark:text-slate-200">
<span class="material-symbols-outlined">tune</span>
</button></a>
</div>
<div class="flex gap-2 overflow-x-auto no-scrollbar pointer-events-auto">
<select id="filter-genero" class="flex items-center gap-1 bg-white dark:bg-background-dark text-slate-700 dark:text-slate-200 px-3 py-2 rounded-full whitespace-nowrap shadow-md border border-slate-200/50 dark:border-slate-700/50 text-sm font-medium focus:ring-0">
<option value="">Todos</option>
<option value="mixto">Mixto</option>
<option value="hombres">Solo hombres</option>
<option value="mujeres">Solo mujeres</option>
</select>
<select id="filter-mascotas" class="flex items-center gap-1 bg-white dark:bg-background-dark text-slate-700 dark:text-slate-200 px-3 py-2 rounded-full whitespace-nowrap shadow-md border border-slate-200/50 dark:border-slate-700/50 text-sm font-medium focus:ring-0">
<option value="">Mascotas: todas</option>
<option value="si">Mascotas: s&iacute;</option>
<option value="no">Mascotas: no</option>
</select>
<select id="filter-habitaciones" class="flex items-center gap-1 bg-white dark:bg-background-dark text-slate-700 dark:text-slate-200 px-3 py-2 rounded-full whitespace-nowrap shadow-md border border-slate-200/50 dark:border-slate-700/50 text-sm font-medium focus:ring-0">
<option value="0">Habitaciones: todas</option>
<option value="1">1+ hab.</option>
<option value="2">2+ hab.</option>
<option value="3">3+ hab.</option>
</select>
<select id="filter-precio" class="flex items-center gap-1 bg-white dark:bg-background-dark text-slate-700 dark:text-slate-200 px-3 py-2 rounded-full whitespace-nowrap shadow-md border border-slate-200/50 dark:border-slate-700/50 text-sm font-medium focus:ring-0">
<option value="">Precio: todos</option>
<option value="0-600">Hasta 600&euro;</option>
<option value="600-800">600 - 800&euro;</option>
<option value="800-1000">800 - 1000&euro;</option>
<option value="1000-999999">M&aacute;s de 1000&euro;</option>
</select>
<button id="filter-escuelas" class="flex items-center gap-1 bg-white dark:bg-background-dark text-slate-700 dark:text-slate-200 px-3 py-2 rounded-full whitespace-nowrap shadow-md border border-slate-200/50 dark:border-slate-700/50 text-sm font-medium transition-colors">
<span class="material-symbols-outlined text-base">school</span>
<span>Zonas escolares</span>
</button>
</div>
</div>
<div class="mt-auto relative z-10 flex flex-col pointer-events-none">
<div class="flex flex-col items-end gap-3 px-4 mb-4 pointer-events-auto">
<button id="btn-centrar" class="bg-white dark:bg-background-dark shadow-lg rounded-full h-12 w-12 flex items-center justify-center text-slate-700 dark:text-slate-200 border border-slate-200/50 dark:border-slate-700/50">
<span class="material-symbols-outlined">my_location</span>
</button>
<a href="/screens-static/explorar_casas/code.html" class="block w-full cursor-pointer"><button class="bg-slate-900 dark:bg-primary text-white shadow-lg rounded-full px-5 h-12 flex items-center gap-2 font-semibold">
<span class="material-symbols-outlined">list</span>
<span>Ver lista</span>
</button></a>
</div>
<div id="map-cards" class="flex gap-4 overflow-x-auto no-scrollbar pb-8 px-4 pointer-events-auto"></div>
<div id="map-empty" class="hidden pointer-events-auto mx-auto mb-8 bg-white dark:bg-background-dark rounded-xl shadow-xl border border-slate-200/50 dark:border-slate-700/50 px-6 py-4 text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2">
<span class="material-symbols-outlined text-slate-400">search_off</span>
Sin casas que coincidan con los filtros.
</div>
</div>
<nav class="relative z-20 bg-white dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 flex justify-between items-center px-6 py-3">
<a class="flex flex-col items-center gap-1 text-primary" href="/screens-static/explorar_casas/code.html">
<span class="material-symbols-outlined fill-1">map</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Explorar</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="/screens-static/mis_favoritos/code.html">
<span class="material-symbols-outlined">favorite</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Favoritos</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="/screens-static/mensajes_y_afinidad/code.html">
<span class="material-symbols-outlined">chat_bubble</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Chat</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="/screens-static/perfil_de_usuario_con_rol_diferenciado/code.html">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Perfil</span>
</a>
</nav>
</div>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var pinsEl = document.getElementById('map-pins');
  var cardsEl = document.getElementById('map-cards');
  var emptyEl = document.getElementById('map-empty');
  if (!pinsEl || !cardsEl) return;

  var posiciones = [
    ['25%', '33%'], ['50%', '50%'], ['33%', '75%'],
    ['66%', '25%'], ['75%', '60%'], ['40%', '15%'],
    ['60%', '80%'], ['20%', '60%']
  ];
  var escuelas = [
    { nombre: 'Colegio San Gabriel', top: '15%', left: '22%' },
    { nombre: 'IES La Paz', top: '28%', left: '68%' },
    { nombre: 'CEIP Cervantes', top: '52%', left: '45%' },
    { nombre: 'Colegio Alameda', top: '72%', left: '72%' }
  ];

  var estado = {
    busqueda: '',
    genero: '',
    mascotas: '',
    habitaciones: 0,
    precio: '',
    escuelas: false
  };
  var casas = [];

  function getInputs() {
    return {
      search: document.getElementById('filter-search'),
      genero: document.getElementById('filter-genero'),
      mascotas: document.getElementById('filter-mascotas'),
      habitaciones: document.getElementById('filter-habitaciones'),
      precio: document.getElementById('filter-precio'),
      escuelas: document.getElementById('filter-escuelas')
    };
  }

  function enRangoPrecio(p, rango) {
    if (!rango) return true;
    var parts = rango.split('-');
    var min = parseInt(parts[0], 10) || 0;
    var max = parseInt(parts[1], 10) || Infinity;
    return p >= min && p <= max;
  }

  function filtrar() {
    var q = estado.busqueda.trim().toLowerCase();
    return casas.filter(function (c) {
      if (estado.genero && c.genero_ok !== estado.genero) return false;
      if (estado.mascotas === 'si' && !c.mascotas) return false;
      if (estado.mascotas === 'no' && c.mascotas) return false;
      if (estado.habitaciones > 0 && (c.habitaciones || 0) < estado.habitaciones) return false;
      if (!enRangoPrecio(c.precio, estado.precio)) return false;
      if (estado.escuelas && !c.custodia_ok) return false;
      if (q) {
        var texto = ((c.ciudad || '') + ' ' + (c.titulo || '')).toLowerCase();
        if (texto.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function pintarEscuelas() {
    var prev = document.getElementById('map-escuelas');
    if (prev) prev.remove();
    if (!estado.escuelas) return;
    var cont = document.createElement('div');
    cont.id = 'map-escuelas';
    cont.className = 'absolute inset-0 pointer-events-none';
    escuelas.forEach(function (e) {
      var pin = document.createElement('div');
      pin.className = 'absolute flex flex-col items-center gap-1';
      pin.style.top = e.top;
      pin.style.left = e.left;
      pin.innerHTML = '<span class="w-9 h-9 rounded-full bg-sky-500/90 text-white flex items-center justify-center shadow-lg border-2 border-white">' +
        '<span class="material-symbols-outlined text-base">school</span></span>' +
        '<span class="bg-white dark:bg-background-dark text-[10px] font-bold px-2 py-0.5 rounded-full shadow border border-slate-200/50 dark:border-slate-700/50">' + esc(e.nombre) + '</span>';
      cont.appendChild(pin);
    });
    pinsEl.appendChild(cont);
  }

  function pintarPins(lista) {
    var pins = pinsEl.querySelectorAll('.casa-pin');
    pins.forEach(function (p) { p.remove(); });
    lista.forEach(function (casa, i) {
      var pos = posiciones[i % posiciones.length];
      var pin = document.createElement('a');
      pin.href = '/screens-static/detalle_de_la_casa/code.html?id=' + casa.id;
      pin.className = 'casa-pin absolute bg-primary text-white px-3 py-1 rounded-full font-bold shadow-lg cursor-pointer hover:scale-110 transition-transform';
      pin.style.top = pos[0];
      pin.style.left = pos[1];
      pin.textContent = casa.precio + '\u20ac';
      pinsEl.appendChild(pin);
    });
  }

  function pintarCards(lista) {
    cardsEl.innerHTML = '';
    lista.forEach(function (casa) {
      var foto = (casa.fotos && casa.fotos[0]) || '';
      var img = foto
        ? '<img alt="' + esc(casa.titulo || '') + '" class="w-full h-full object-cover" src="' + esc(foto) + '">'
        : '<div class="w-full h-full bg-slate-300 dark:bg-slate-700 flex items-center justify-center"><span class="material-symbols-outlined text-4xl text-slate-500">home</span></div>';
      var habs = (casa.habitaciones || 1) + ' hab.';
      var chip = casa.mascotas ? 'Mascotas s\u00ed' : 'Sin mascotas';
      if (casa.custodia_ok) chip = 'Custodia: ' + casa.custodia_ok;
      var card = document.createElement('a');
      card.href = '/screens-static/detalle_de_la_casa/code.html?id=' + casa.id;
      card.className = 'min-w-[300px] bg-white dark:bg-background-dark rounded-xl shadow-2xl overflow-hidden flex flex-col border border-slate-200/50 dark:border-slate-700/50 cursor-pointer';
      card.innerHTML =
        '<div class="relative h-40">' + img +
          '<div class="absolute top-3 left-3 bg-primary/90 backdrop-blur-sm text-white px-2 py-1 rounded-lg text-xs font-bold">' + casa.precio + '\u20ac</div>' +
        '</div>' +
        '<div class="p-4">' +
          '<h3 class="font-bold text-lg">' + esc(casa.titulo || '') + '</h3>' +
          '<p class="text-sm text-slate-500 mb-3 flex items-center gap-1">' +
            '<span class="material-symbols-outlined text-sm">location_on</span> ' + esc(casa.ciudad || '') +
          '</p>' +
          '<div class="flex items-center gap-3 text-xs font-medium text-slate-600 dark:text-slate-400">' +
            '<span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">bed</span> ' + habs + '</span>' +
            '<span class="flex items-center gap-1"><span class="material-symbols-outlined text-base">' + (casa.mascotas ? 'pets' : 'pets_off') + '</span> ' + chip + '</span>' +
          '</div>' +
        '</div>';
      cardsEl.appendChild(card);
    });
    var visible = lista.length > 0;
    if (emptyEl) emptyEl.classList.toggle('hidden', visible);
  }

  function render() {
    var lista = filtrar();
    pintarEscuelas();
    pintarPins(lista);
    pintarCards(lista);
    var btn = document.getElementById('filter-escuelas');
    if (btn) {
      btn.className = 'flex items-center gap-1 px-3 py-2 rounded-full whitespace-nowrap shadow-md text-sm font-medium transition-colors ' +
        (estado.escuelas
          ? 'bg-sky-500 text-white border border-sky-500'
          : 'bg-white dark:bg-background-dark text-slate-700 dark:text-slate-200 border border-slate-200/50 dark:border-slate-700/50');
    }
  }

  function bind() {
    var inputs = getInputs();
    if (inputs.search) inputs.search.addEventListener('input', function () {
      estado.busqueda = inputs.search.value;
      render();
    });
    if (inputs.genero) inputs.genero.addEventListener('change', function () {
      estado.genero = inputs.genero.value;
      render();
    });
    if (inputs.mascotas) inputs.mascotas.addEventListener('change', function () {
      estado.mascotas = inputs.mascotas.value;
      render();
    });
    if (inputs.habitaciones) inputs.habitaciones.addEventListener('change', function () {
      estado.habitaciones = parseInt(inputs.habitaciones.value, 10) || 0;
      render();
    });
    if (inputs.precio) inputs.precio.addEventListener('change', function () {
      estado.precio = inputs.precio.value;
      render();
    });
    if (inputs.escuelas) inputs.escuelas.addEventListener('click', function () {
      estado.escuelas = !estado.escuelas;
      render();
    });
    var centrar = document.getElementById('btn-centrar');
    if (centrar) centrar.addEventListener('click', function () { render(); });
  }

  bind();
  render();

  var token = localStorage.getItem('rehogar_token');
  var opts = token ? { headers: { 'Authorization': 'Bearer ' + token } } : undefined;
  fetch('/api/casas?limite=50', opts)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      casas = (data && data.casas) || [];
      render();
    })
    .catch(function () {});
})();
</script>
<script src="/nav.js"></script>
</body></html>
